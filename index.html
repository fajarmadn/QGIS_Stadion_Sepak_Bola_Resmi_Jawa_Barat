<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peta Sebaran Stadion Sepak Bola Resmi Jawa Barat</title>
  
  <!-- Font Open Sans Regular (Persis Settingan Asli QGIS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    /* Style Label Kotak Persegi Polos Teks Putih Font Open Sans Regular (Tidak Tebal) */
    .qgis-label {
      background: #000000 !important;
      color: #ffffff !important;
      font-family: "Open Sans", sans-serif !important;
      font-size: 10px !important;
      font-weight: 400 !important; /* Regular / Tidak Tebal */
      padding: 2px 5px !important;
      border-radius: 0 !important; /* Kotak persegi polos tanpa lengkungan */
      border: 1px solid #444444 !important;
      white-space: nowrap !important;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6) !important;
      pointer-events: none !important; /* Murni visual, tidak bisa diklik */
      user-select: none !important;
    }
    /* Hilangkan panah segitiga bawaan Leaflet */
    .leaflet-tooltip-top:before,
    .leaflet-tooltip-bottom:before,
    .leaflet-tooltip-left:before,
    .leaflet-tooltip-right:before {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Data Geospasial Vektor -->
  <script src="data/batas_jawa_barat.js"></script>
  <script src="data/stadion.js"></script>

  <script>
    // 1. Inisialisasi peta Leaflet dengan batas zoom minimal
    var map = L.map('map', {
      zoomControl: true,
      minZoom: 8
    }).setView([-6.86858, 107.603], 9);

    // 2. Basemap OpenStreetMap dengan Attribution Khas QGIS
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: 'Created by QGIS | &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // 3. Layer Batas Provinsi Jawa Barat (Garis Merah Khas QGIS)
    var layerBatas = L.geoJSON(batasJawaBarat, {
      interactive: false,
      style: {
        color: '#d32f2f',
        weight: 2.5,
        opacity: 0.95,
        fillColor: '#d32f2f',
        fillOpacity: 0.04
      }
    }).addTo(map);

    // 4. Ikon Bintang Ledakan Kuning (Starburst Asli QGIS)
    var starburstIcon = L.divIcon({
      className: 'qgis-star-marker',
      html: '<svg width="22" height="22" viewBox="-12 -12 24 24" style="display:block;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.6));pointer-events:none;">' +
              '<polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fff000" stroke="#000000" stroke-width="1.2"/>' +
              '<polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" transform="rotate(34)" fill="#fff000" stroke="#000000" stroke-width="1.2"/>' +
            '</svg>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    // 5. Layer 40 Titik Stadion Sepak Bola Jawa Barat (Murni Visual, Tanpa Respon Klik)
    var layerStadion = L.geoJSON(dataStadion, {
      pointToLayer: function (feature, latlng) {
        return L.marker(latlng, {
          icon: starburstIcon,
          interactive: false // Mematikan seluruh interaksi klik
        });
      },
      onEachFeature: function (feature, layer) {
        var p = feature.properties;

        // Label Nama Stadion Selalu Menyala (Kotak Polos Font Open Sans Regular)
        layer.bindTooltip(p.nama, {
          permanent: true,
          direction: 'top',
          offset: [0, -12],
          className: 'qgis-label',
          interactive: false
        });
      }
    }).addTo(map);

    // 6. Kunci Area Jelajah Hanya di Sekeliling Jawa Barat (maxBounds)
    if (layerBatas.getBounds().isValid()) {
      var jabarBounds = layerBatas.getBounds().pad(0.08);
      map.fitBounds(layerBatas.getBounds(), { padding: [25, 25] });
      map.setMaxBounds(jabarBounds);
      map.options.maxBoundsViscosity = 1.0; // Hard lock: otomatis membal jika ditarik keluar
    }
  </script>
</body>
</html>
