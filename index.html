<!DOCTYPE html>
<html>
<head>
  <title>Peta Sebaran Stadion Sepak Bola Resmi Jawa Barat</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style type="text/css">
    body { margin: 0; padding: 0; }
    html, body, #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // 1. Koordinat batas Jawa Barat sesuai metadata file MBTiles Anda
    var jabarBounds = [[-7.8234, 106.371], [-5.91377, 108.834]];

    // 2. Inisialisasi peta Leaflet dengan batas wilayah terkunci (maxBounds)
    var map = L.map('map', {
      attributionControl: false,
      minZoom: 8,
      maxZoom: 15,
      maxBounds: jabarBounds,
      maxBoundsViscosity: 1.0
    }).setView([-6.8695, 107.6025], 10);

    L.control.attribution({prefix: false}).addTo(map);

    // 3. Layer Raster Tile MBTiles langsung dari MapTiler Cloud CDN
    var tilesource_layer = L.tileLayer('https://api.maptiler.com/tiles/01a08bc9-65c7-7916-8a9c-c27e70e52f1a/{z}/{x}/{y}.png?key=yD64TmYiA59AvEayF4Ho', {
      minZoom: 8,
      maxZoom: 15,
      tms: false,
      attribution: 'Created by QGIS | &copy; <a href="https://www.maptiler.com/copyright/" target="_blank">MapTiler</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
    }).addTo(map);
  </script>
</body>
</html>
